name: PMOVES Audit Gate

on:
  push:
    branches: [PMOVES.AI-Edition-Hardened]
  pull_request:
    branches: [PMOVES.AI-Edition-Hardened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python compile check
        run: |
          find pmoves_announcer pmoves_common pmoves_health pmoves_registry api helpers \
            -name '*.py' -not -path '*/.git/*' -not -path '*/venv/*' 2>/dev/null | head -20 | xargs -I{} python -m py_compile {}

      - name: Validate integration manifest
        run: |
          test -f PMOVES.AI_INTEGRATION.md || { echo "Missing integration manifest"; exit 1; }
          grep -q 'NATS Enabled.*True' PMOVES.AI_INTEGRATION.md || { echo "NATS must be enabled"; exit 1; }
          grep -q '/healthz' PMOVES.AI_INTEGRATION.md || echo "WARN: healthz not documented"


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check pmoves_announcer/ pmoves_common/ pmoves_registry/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          config: |
            paths:
              - pmoves_announcer
              - pmoves_common
              - pmoves_health
              - pmoves_registry
              - api
              - helpers
      - uses: github/codeql-action/analyze@v4
