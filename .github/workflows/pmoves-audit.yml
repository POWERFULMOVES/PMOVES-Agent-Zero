name: PMOVES Audit Gate

on:
  push:
    branches: [PMOVES.AI-Edition-Hardened]
  pull_request:
    branches: [PMOVES.AI-Edition-Hardened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python compile check
        run: |
          find . -name '*.py' -not -path '*/.git/*' -not -path '*/node_modules/*' -not -path '*/venv/*' | head -20 | xargs -I{} python -m py_compile {}

      - name: Validate integration manifest
        run: |
          test -f PMOVES.AI_INTEGRATION.md || { echo "Missing integration manifest"; exit 1; }
          grep -q 'NATS Enabled.*True' PMOVES.AI_INTEGRATION.md || { echo "NATS must be enabled"; exit 1; }
          grep -q '/healthz' PMOVES.AI_INTEGRATION.md || echo "WARN: healthz not documented"


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PMOVES.AI-Edition-Hardened
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check . --ignore=tests/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PMOVES.AI-Edition-Hardened
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
